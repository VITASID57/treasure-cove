<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>百宝湾</title>
<meta name="description" content="给小机子们准备的插件与小工具合集">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23f2c48d'/><path d='M4 19c4-3 8 3 12 0s8-3 12 0v6H4z' fill='%233a8f8a'/></svg>">
<style>
:root{--sand:#f7efe2;--paper:#fffaf2;--ink:#2d3a3a;--muted:#6b7a78;--sea:#3a8f8a;--sea-soft:#d8ece8;--deep:#1f4e5f;--line:#e4d8c4;--warn:#b5543c;--radius:14px}
@media (prefers-color-scheme:dark){:root{--sand:#14201f;--paper:#1b2a29;--ink:#e8efe9;--muted:#9fb1ad;--sea:#6cc2b9;--sea-soft:#22403d;--deep:#0d2733;--line:#2c3f3d;--warn:#e08a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(180deg,var(--sea-soft),var(--sand));padding:28px 16px 18px}
header .wrap,main{max-width:760px;margin:0 auto}
h1{margin:0;font-size:28px;letter-spacing:.04em}
header p{margin:6px 0 0;color:var(--muted)}
main{padding:8px 16px 48px}
.tools{display:grid;gap:10px;position:sticky;top:0;background:var(--sand);padding:10px 0;z-index:2}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.chip.deep[aria-pressed=true]{background:var(--deep);border-color:var(--deep)}
.list{display:grid;gap:14px;margin-top:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.card.adult{border-color:var(--deep)}
.card h2{margin:0;font-size:19px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.tag{background:var(--sea-soft);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:13px}
.tag.deep{background:var(--deep);color:#fff}
.card p{margin:0}
.card ul{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.preview{margin:0;display:grid;gap:6px}
.card img{width:100%;border-radius:10px;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions a,.actions button{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--sea);color:var(--sea);background:transparent;font:inherit;font-size:15px;text-decoration:none;cursor:pointer}
.actions .primary{background:var(--sea);color:#fff}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:none;border-radius:var(--radius);background:var(--paper);color:var(--ink);max-width:min(420px,calc(100vw - 32px));padding:22px}
dialog::backdrop{background:rgba(13,39,51,.55)}
dialog h3{margin:0 0 8px}
dialog .actions{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
footer a{color:var(--sea)}
</style>
</head>
<body>
<header><div class="wrap"><h1>百宝湾</h1><p>大家冲上岸的插件和小工具，路过就捡走。</p></div></header>
<main>
  <div class="tools">
    <input id="q" type="search" aria-label="搜索">
    <div class="chips" id="kinds"></div>
  </div>
  <div class="list" id="list"></div>
</main>
<footer>百宝湾由社区维护，不是任何产品的官方渠道；作品归各自作者所有。<a href="https://github.com" id="repo">投稿与规矩</a></footer>
<dialog id="deep-ask">
  <h3>要下深水区吗？</h3>
  <p>深水区是成人向作品，只给已经成年的人看。</p>
  <div class="actions"><button id="deep-no">算了</button><button class="primary" id="deep-yes">我已成年</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const KIND = { 'town-plugin': '小镇插件', 'remote-mcp': '远程 MCP', 'web-app': '网页小玩意', 'self-host': '需要自己部署', adapter: '适配包' };
const state = { kind: 'all', deep: false, query: '', entries: [] };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => { const node = Object.assign(document.createElement(tag), props); node.append(...children.filter(Boolean)); return node; };
const remembered = () => { try { return localStorage.getItem('cove-deep') === 'yes'; } catch { return false; } };
const remember = () => { try { localStorage.setItem('cove-deep', 'yes'); } catch { /* private mode: ask again next time */ } };

function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('已复制'); } catch { prompt('复制这个地址', text); } }

function chips() {
  const box = $('kinds'); box.replaceChildren();
  const add = (id, label, deep = false) => { const b = el('button', { className: `chip${deep ? ' deep' : ''}`, textContent: label, type: 'button' });
    b.setAttribute('aria-pressed', String(deep ? state.deep : state.kind === id));
    b.onclick = () => { if (deep) return toggleDeep(); state.kind = id; render(); }; box.append(b); };
  add('all', '全部'); for (const [id, label] of Object.entries(KIND)) add(id, label); add('', '深水区', true);
}

function toggleDeep() {
  if (state.deep) { state.deep = false; return render(); }
  if (remembered()) { state.deep = true; return render(); }
  $('deep-ask').showModal();
}
$('deep-no').onclick = () => $('deep-ask').close();
$('deep-yes').onclick = () => { remember(); state.deep = true; $('deep-ask').close(); render(); };

function actions(entry) {
  const box = el('div', { className: 'actions' }); const i = entry.install || {};
  if (i.package) box.append(el('a', { className: 'primary', href: i.package, download: '', textContent: '下载插件包' }));
  if (i.mcpUrl) { const b = el('button', { className: 'primary', type: 'button', textContent: '复制 MCP 地址' }); b.onclick = () => copy(i.mcpUrl); box.append(b); }
  if (i.webUrl) box.append(el('a', { className: 'primary', href: i.webUrl, target: '_blank', rel: 'noopener', textContent: '打开' }));
  if (i.guide) box.append(el('a', { href: i.guide, target: '_blank', rel: 'noopener', textContent: '部署说明' }));
  box.append(el('a', { href: entry.source, target: '_blank', rel: 'noopener', textContent: '查看源码' }));
  return box;
}

function card(entry) {
  const adult = entry.rating === 'adult';
  const meta = el('div', { className: 'meta' }, el('span', { className: 'tag', textContent: KIND[entry.kind] || entry.kind }),
    adult ? el('span', { className: 'tag deep', textContent: '深水区' }) : null,
    ...(entry.tags || []).map((tag) => el('span', { className: 'tag', textContent: tag })));
  const by = entry.origin === 'repost' || entry.kind === 'adapter'
    ? `原作：${entry.author.name}${entry.submitter ? ` · ${entry.kind === 'adapter' ? '适配' : '投稿'}：${entry.submitter}` : ''}`
    : `作者：${entry.author.name}`;
  const notes = [by, `许可：${entry.license === 'none' ? '原作未写许可，仅收录链接' : entry.license}`, `版本 ${entry.version}`, entry.updated];
  const isTownPlugin = entry.kind === 'town-plugin' || Boolean(entry.install?.package);
  const body = el('article', { className: `card${adult ? ' adult' : ''}` }, el('h2', { textContent: entry.name }), meta,
    el('p', { textContent: entry.summary }),
    entry.highlights?.length ? el('ul', {}, ...entry.highlights.map((item) => el('li', { textContent: item }))) : null,
    entry.screenshot ? el('figure', { className: 'preview' },
      el('figcaption', { className: 'note', textContent: isTownPlugin
        ? '插件界面示意图 · 安装后在棉棉云小镇内操作'
        : '界面示意图' }),
      el('img', { src: entry.screenshot, alt: '', loading: 'lazy' })) : null,
    actions(entry),
    el('div', { className: 'note', textContent: notes.join(' · ') }),
    entry.install?.sha256 ? el('div', { className: 'note', textContent: `插件包指纹 ${entry.install.sha256}` }) : null,
    entry.forkOf ? el('div', { className: 'note', textContent: `这是复制版，原版在 ${entry.forkOf}` }) : null,
    isTownPlugin ? el('div', { className: 'note', textContent: '在小镇「插件中心 → 添加插件 → 从文件安装」导入下载的插件包。' }) : null);
  return body;
}

function render() {
  chips();
  const q = state.query.trim().toLowerCase();
  const shown = state.entries.filter((entry) => (state.deep || entry.rating !== 'adult')
    && (state.kind === 'all' || entry.kind === state.kind)
    && (!q || [entry.name, entry.summary, ...(entry.tags || []), entry.author?.name].join(' ').toLowerCase().includes(q)));
  $('list').replaceChildren(...(shown.length ? shown.map(card) : [el('p', { className: 'empty', textContent: state.entries.length ? '这里还没有冲上岸的东西。' : '正在退潮……' })]));
}

$('q').addEventListener('input', (event) => { state.query = event.target.value; render(); });
fetch('index.json', { cache: 'no-cache' }).then((r) => r.json()).then((data) => { state.entries = data.entries || []; render(); })
  .catch(() => { $('list').replaceChildren(el('p', { className: 'empty', textContent: '索引没有读到，稍后再来。' })); });
const repo = location.hostname.endsWith('github.io') ? `https://github.com/${location.hostname.split('.')[0]}/${location.pathname.split('/')[1] || ''}` : null;
if (repo) $('repo').href = repo;
render();
</script>
</body>
</html>
